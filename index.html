<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Marocos ❤️ Cassia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<div id="login">
    <h1>💖 Nosso Amor 💖</h1>
    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">
    <button onclick="entrar()">Entrar</button>
    <p id="erro"></p>
</div>

<div id="conteudo">

    <h1>Marcos ❤️ Cassia</h1>

    <div class="menu">
        <button onclick="mostrar('home')">Início</button>
        <button onclick="mostrar('fotos')">Fotos</button>
        <button onclick="mostrar('mensagens')">Mensagens</button>
    </div>

    <div id="home" class="aba">
        <h2>Minha Cassia 💕</h2>
        <p>
        Você é a melhor parte da minha vida.
        Cada momento com você é especial.
        Eu te amo hoje, amanhã e para sempre ❤️
        </p>
    </div>

    <div id="fotos" class="aba">
        <h2>Nossos Momentos 📸</h2>
         <div class="galeria">
            <img src="foto1.jpg" width="300">
            <img src="foto2.jpg" width="300">
            <img src="foto3.jpg" width="300">
       </div>

    </div>

    <div id="mensagens" class="aba">
        <h2>Mensagens 💌</h2>
        <p>Você é meu sonho realizado 💖</p>
        <p>Eu escolheria você mil vezes ❤️</p>
        <p>Nosso amor é eterno ✨</p>
    </div>

</div>

<div class="coracoes"></div>

<script src="script.js"></script>
</body>
</html>
